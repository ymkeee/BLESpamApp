name: Build BLESpam TIPA (TrollStore)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Package TIPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install ldid
        run: brew install ldid

      - name: List schemes
        run: xcodebuild -project BLESpamApp.xcodeproj -list 2>&1 || true

      - name: Build
        run: |
          xcodebuild \
            -project BLESpamApp.xcodeproj \
            -target BLESpamApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE="" \
            ARCHS="arm64 arm64e" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR="$PWD/build" \
            build

      - name: Locate .app
        id: locate
        run: |
          APP=$(find build -name "BLESpamApp.app" -type d | head -1)
          echo "Found: $APP"
          [ -n "$APP" ] || (echo "ERROR: .app not found"; find build -type f | head -30; exit 1)
          echo "APP_PATH=$APP" >> "$GITHUB_OUTPUT"

      - name: Sign with ldid
        run: |
          ldid -S"BLESpamApp/Resources/entitlements.plist" \
               "${{ steps.locate.outputs.APP_PATH }}/BLESpamApp"

      - name: Package .tipa
        run: |
          mkdir -p Payload
          cp -r "${{ steps.locate.outputs.APP_PATH }}" Payload/BLESpamApp.app
          zip -r BLESpam.ipa Payload/
          cp BLESpam.ipa BLESpam.tipa
          du -sh BLESpam.tipa

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: BLESpam-TrollStore
          path: |
            BLESpam.tipa
            BLESpam.ipa
          retention-days: 30
