name: Build BLESpam TIPA (TrollStore)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false   # do NOT cancel previous runs

jobs:
  build:
    name: Build & Package TIPA
    runs-on: macos-14   # Sonoma — Xcode 15.x guaranteed

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Select latest available Xcode ───────────────────────────────────
      - name: Select Xcode
        run: |
          echo "=== Available Xcode installations ==="
          ls /Applications/ | grep -i xcode || true
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ── 3. Install ldid ────────────────────────────────────────────────────
      - name: Install ldid
        run: |
          brew install ldid
          ldid -v || true

      # ── 4. List available schemes (debug) ──────────────────────────────────
      - name: List schemes
        run: |
          xcodebuild -project BLESpamApp.xcodeproj -list 2>&1 || true

      # ── 5. Build ───────────────────────────────────────────────────────────
      - name: Build with xcodebuild
        run: |
          xcodebuild \
            -project BLESpamApp.xcodeproj \
            -target BLESpamApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE="" \
            ARCHS="arm64 arm64e" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR="$PWD/build" \
            build 2>&1

      # ── 6. Locate .app ─────────────────────────────────────────────────────
      - name: Locate .app bundle
        id: locate
        run: |
          echo "=== Build output ==="
          find build -name "*.app" -type d 2>/dev/null || true
          APP_PATH=$(find build -name "BLESpamApp.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: BLESpamApp.app not found"
            find build -type f | head -20
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

      # ── 7. Pseudo-sign with ldid ───────────────────────────────────────────
      - name: Pseudo-sign with ldid
        run: |
          APP="${{ steps.locate.outputs.APP_PATH }}"
          BINARY="$APP/BLESpamApp"
          echo "Signing: $BINARY"
          ldid -S"BLESpamApp/Resources/entitlements.plist" "$BINARY"
          echo "Entitlements embedded:"
          ldid -e "$BINARY" | head -30

      # ── 8. Package .tipa ───────────────────────────────────────────────────
      - name: Package .tipa
        run: |
          APP="${{ steps.locate.outputs.APP_PATH }}"
          mkdir -p Payload
          cp -r "$APP" Payload/BLESpamApp.app
          zip -r BLESpam.ipa Payload/
          cp BLESpam.ipa BLESpam.tipa
          echo "=== Package sizes ==="
          du -sh BLESpam.tipa BLESpam.ipa

      # ── 9. Upload artifacts ────────────────────────────────────────────────
      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: BLESpam-TrollStore
          path: |
            BLESpam.tipa
            BLESpam.ipa
          retention-days: 30

      # ── 10. Create GitHub Release on tag push ──────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BLESpam.tipa
            BLESpam.ipa
          name: "BLESpam ${{ github.ref_name }}"
          body: |
            ## BLESpam ${{ github.ref_name }}

            TrollStore-compatible package.

            ### Install
            1. Download `BLESpam.tipa`
            2. Open **TrollStore** → **+** → выбери файл
            3. Tap **Install**

            ### Requirements
            - iOS 15.0–16.x  
            - TrollStore 2.x  
            - Bluetooth enabled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
