name: Build BLESpam TIPA (TrollStore)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build .tipa on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang + lld + zip + curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld zip curl git

      - name: Install ldid (pre-built)
        run: |
          sudo curl -fsSL \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64" \
            -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          echo "ldid installed at $(which ldid)"

      - name: Download iOS 16.5 SDK
        run: |
          mkdir -p /opt/sdks
          # Clone only the 16.5 SDK folder (sparse checkout — much faster than full clone)
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -r iPhoneOS16.5.sdk /opt/sdks/
          echo "SDK ready: $(ls /opt/sdks/)"

      - name: Compile binary (arm64)
        run: |
          clang \
            -target arm64-apple-ios15.0 \
            -isysroot /opt/sdks/iPhoneOS16.5.sdk \
            -fobjc-arc \
            -fuse-ld=lld \
            -framework UIKit \
            -framework CoreBluetooth \
            -framework CoreFoundation \
            -o /tmp/BLESpam \
            src/main.m
          file /tmp/BLESpam

      - name: Assemble .app bundle
        run: |
          mkdir -p /tmp/BLESpam.app
          cp /tmp/BLESpam /tmp/BLESpam.app/BLESpam
          # Write Info.plist directly — no Xcode variables
          cat > /tmp/BLESpam.app/Info.plist << 'PLISTEOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleExecutable</key>
  <string>BLESpam</string>
  <key>CFBundleIdentifier</key>
  <string>com.example.blespam</string>
  <key>CFBundleName</key>
  <string>BLESpam</string>
  <key>CFBundleDisplayName</key>
  <string>BLESpam</string>
  <key>CFBundleShortVersionString</key>
  <string>1.0</string>
  <key>CFBundleVersion</key>
  <string>1</string>
  <key>CFBundlePackageType</key>
  <string>APPL</string>
  <key>MinimumOSVersion</key>
  <string>15.0</string>
  <key>LSRequiresIPhoneOS</key>
  <true/>
  <key>NSBluetoothAlwaysUsageDescription</key>
  <string>Used to broadcast BLE advertisement packets.</string>
  <key>NSBluetoothPeripheralUsageDescription</key>
  <string>Used for BLE peripheral mode.</string>
  <key>UISupportedInterfaceOrientations</key>
  <array>
    <string>UIInterfaceOrientationPortrait</string>
  </array>
</dict>
</plist>
PLISTEOF
          echo "Bundle: $(ls -la /tmp/BLESpam.app/)"

      - name: Sign with ldid
        run: |
          ldid -SBLESpamApp/Resources/entitlements.plist /tmp/BLESpam.app/BLESpam
          echo "Signed OK"
          ldid -e /tmp/BLESpam.app/BLESpam | head -10

      - name: Package .tipa
        run: |
          mkdir -p /tmp/tipa/Payload
          cp -r /tmp/BLESpam.app /tmp/tipa/Payload/BLESpam.app
          cd /tmp/tipa
          zip -r BLESpam.ipa Payload/
          cp BLESpam.ipa BLESpam.tipa
          echo "Size: $(du -sh BLESpam.tipa)"
          cp BLESpam.tipa $GITHUB_WORKSPACE/
          cp BLESpam.ipa  $GITHUB_WORKSPACE/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLESpam-TrollStore
          path: |
            BLESpam.tipa
            BLESpam.ipa
          retention-days: 30
